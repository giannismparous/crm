[build]
  command = "npm run build"
  publish = "dist"

# Firebase Web SDK config is public in the client bundle (VITE_*). Omit those keys
# from secrets scanning so deploys are not blocked. See https://ntl.fyi/configure-secrets-scanning
[build.environment]
  SECRETS_SCAN_OMIT_PATHS = ".firebaserc,.env.example"
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_APP_ID,VITE_FIREBASE_MEASUREMENT_ID"
  # Firebase client config is public; prevent smart scan from masking VITE_* in dist/
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"
